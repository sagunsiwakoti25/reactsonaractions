name: Deploy Dist
on: 
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/*'
  workflow_dispatch:
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
              # run: |
              #   echo "Cloning Repo."
              #   echo "${{ toJson(github) }}"
              #   git clone https://github.com/${{github.repository}}.git
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20.x

            - name: Cache Dependecies
              uses: actions/cache@v3
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm run test

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20.x

            - name: Cache Dependecies
              uses: actions/cache@v3
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  

            - name: Install Dependencies
              run: npm ci

            - name: Build Project
              run: npm run build

            - name: Upload artifiact
              uses: actions/upload-artifact@v4
              with:
                name: dist-files
                path: ./dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: dist-files
                path: ./dist

            - name: Deploy
              run: echo "Deploying to server..."