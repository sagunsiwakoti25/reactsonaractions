name: Deploy Dist
on: [push,workflow_dispatch]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
              # run: |
              #   echo "Cloning Repo."
              #   echo "${{ toJson(github) }}"
              #   git clone https://github.com/${{github.repository}}.git
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20.x
          
            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npm run test
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
         
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 20.x
          
            - name: Install Dependencies
              run: npm ci

            - name: Build Project
              run: npm run build
            
            - name: Deploy
            - run: echo "Deploying to server..."